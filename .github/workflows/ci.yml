name: CI

on:
  pull_request:
  push:
    branches: [main, staging, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high+ in production deps)
        run: npm audit --omit=dev --audit-level=high

  native:
    name: Native app · typecheck · tests · bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The native app shares plain-TypeScript data from ../src, which needs the website's packages (fuse.js) too.
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund --legacy-peer-deps
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npx jest
        working-directory: mobile
      - name: The app bundles for iOS and Android
        run: npx expo export --platform ios --output-dir /tmp/export-ios && npx expo export --platform android --output-dir /tmp/export-android
        working-directory: mobile
      - name: Browser tests of the native app (the web export Vercel serves)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.native.config.ts

  database:
    name: Database RLS tests · secret scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is installed
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null)
      - run: npm run test:db
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
      - run: bash scripts/secret-scan.sh

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
